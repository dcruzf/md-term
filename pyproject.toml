[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-term"
version = "0.1.0"
description = "Static site generator that serves markdown through a terminal-style interface"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "watchfiles>=0.21",
]

[project.scripts]
md-term = "md_term.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/md_term"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
